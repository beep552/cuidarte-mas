services:
  cuidarteplus-postgres-ev:
    image: postgres:15-alpine
    container_name: cuidarteplus-postgres-ev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-cuidarteplus}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Corrige HAL-03: no se publica el puerto 5432 al host; sólo la red
    # interna del compose puede alcanzar la base.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BACKEND/sql/dump-cuidarteplus.sql:/tmp/dump-cuidarteplus.sql:ro
      - ./BACKEND/sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-cuidarteplus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cuidarteplus-network
    restart: unless-stopped

  cuidarteplus-backend-ev:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: cuidarteplus-backend-ev
    hostname: cuidarteplus-api
    environment:
      - PORT=4000
      - NODE_ENV=${NODE_ENV:-production}
      # Corrige HAL-03: sin contraseña por defecto ni `postgres/postgres`; el
      # entorno exige valores definidos en .env (fail-closed).
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@cuidarteplus-postgres-ev:5432/${POSTGRES_DB:-cuidarteplus}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en .env (openssl rand -hex 32)}
      - FRONTEND_URL=http://localhost:${PORT_FRONTEND:-3333}
      - PG_SSL=${PG_SSL:-}
    ports:
      - "${PORT_BACKEND:-4444}:4000"
    depends_on:
      cuidarteplus-postgres-ev:
        condition: service_healthy
    volumes:
      - ./BACKEND/uploads:/app/uploads
    networks:
      - cuidarteplus-network
    restart: unless-stopped

  cuidarteplus-frontend-ev:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:${PORT_BACKEND:-4444}"
    container_name: cuidarteplus-frontend-ev
    hostname: cuidarteplus-web
    ports:
      - "${PORT_FRONTEND:-3333}:80"
    depends_on:
      - cuidarteplus-backend-ev
    networks:
      - cuidarteplus-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  cuidarteplus-network:
    driver: bridge
    name: cuidarteplus-network
